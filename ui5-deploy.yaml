# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: project1
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: btp292
          url: https://my200292.s4hana.sapcloud.cn
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZPROJECTCARRY
          description: ZPROJECTCARRY
          package: ZTEST_PROJECTCARRY
          transport: ZAZK900859
        exclude:
          - /test/
          - /localService/
